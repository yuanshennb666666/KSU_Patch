name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      # The unit tests run in the dev profile on purpose: the release profile sets
      # panic = "abort", which test binaries cannot use.
      - name: Unit tests
        run: cargo test --locked

      - name: Report the artefact
        shell: pwsh
        run: |
          Get-Item target/release/ksupatch.exe |
            Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } }
